spring:
  application:
    name: account-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:prumo_account}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}

server:
  port: ${SERVER_PORT:8082}

app:
  auth-base-url: ${AUTH_BASE_URL:http://localhost:8081}
  internal-service-key: ${INTERNAL_SERVICE_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
