spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-users
              uri: ${AUTH_BASE_URL:http://localhost:8081}
              predicates:
                - Path=/users
            - id: auth-sessions
              uri: ${AUTH_BASE_URL:http://localhost:8081}
              predicates:
                - Path=/sessions
            - id: accounts
              uri: ${ACCOUNT_BASE_URL:http://localhost:8082}
              predicates:
                - Path=/accounts,/accounts/**
            - id: transactions
              uri: ${TRANSACTION_BASE_URL:http://localhost:8083}
              predicates:
                - Path=/transactions,/transactions/**
            - id: categories
              uri: ${TRANSACTION_BASE_URL:http://localhost:8083}
              predicates:
                - Path=/categories,/categories/**
            - id: transfers
              uri: ${TRANSACTION_BASE_URL:http://localhost:8083}
              predicates:
                - Path=/transfers,/transfers/**
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
                allowedMethods: [GET, POST, PUT, DELETE, OPTIONS]
                allowedHeaders: [Authorization, Content-Type, X-Correlation-Id]
                exposedHeaders: [X-Correlation-Id]
                maxAge: 3600

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
