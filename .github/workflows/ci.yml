name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  test:
    name: Testar ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, account-service, transaction-service]
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 21 e cache do Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      - name: Executar testes
        run: mvn -B -ntp -f "${{ matrix.service }}/pom.xml" verify
