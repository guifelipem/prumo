spring:
  application:
    name: transaction-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:prumo_transaction}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:prumo}
    password: ${RABBITMQ_PASSWORD:prumo}

server:
  port: ${SERVER_PORT:8083}

app:
  account-base-url: ${ACCOUNT_BASE_URL:http://localhost:8082}
  auth-base-url: ${AUTH_BASE_URL:http://localhost:8081}
  internal-service-key: ${INTERNAL_SERVICE_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
