spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:prumo_auth}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}

server:
  port: ${SERVER_PORT:8081}

app:
  internal-service-key: ${INTERNAL_SERVICE_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    level: "%5p [correlationId=%X{correlationId:-}]"
